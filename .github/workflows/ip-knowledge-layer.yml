name: IP Knowledge Layer

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: ip-knowledge-layer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update knowledge layer
        env:
          IPKL_USER_AGENT: "IP-Knowledge-Layer/0.1 (+${{ github.server_url }}/${{ github.repository }}; GitHub Actions public-data collector)"
          IPKL_SNAPSHOT_RETENTION: "168"
          IPKL_HISTORY_RETENTION: "720"
        run: python3 scripts/update.py

      - name: Read release metadata
        id: release
        run: |
          generated_at="$(python3 -c 'import json; print(json.load(open("data/current/summary.json"))["summary"]["generatedAt"])')"
          tag="data-$(printf '%s' "$generated_at" | tr -d ':-' | sed 's/T/-/')"
          echo "generated_at=$generated_at" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update IP knowledge layer"
          file_pattern: "data README.md RELEASE.md"

      - name: Publish data release (rolling)
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_AT: ${{ steps.release.outputs.generated_at }}
        run: |
          gh release delete "data-current" --cleanup-tag --yes || true
          gh release create "data-current" \
            --title "IP Knowledge Layer data $GENERATED_AT" \
            --latest \
            --notes-file RELEASE.md \
            data/current/summary.json \
            data/current/source-index.json \
            data/current/ip-knowledge.jsonl \
            data/current/ip-knowledge.csv \
            data/current/cloud-prefixes.csv \
            data/current/asn-signals.csv \
            data/current/cidr-tags.txt
